<!DOCTYPE html>

<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>✈️ 2026 福岡之旅</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans TC',sans-serif;background:#efefef;color:#1a1a1a;max-width:480px;margin:0 auto;min-height:100vh}

/* TOP BAR */
.bar{background:#1a1a2e;color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100}
.bar h1{flex:1;font-size:1rem;font-weight:700}
.live{display:flex;align-items:center;gap:5px;font-size:.72rem;color:rgba(255,255,255,.75)}
.dot{width:7px;height:7px;border-radius:50%;background:#4ade80;animation:blink 1.8s infinite}
.dot.off{background:#f87171;animation:none}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.bar-btn{background:#333;color:#fff;border:none;padding:7px 13px;border-radius:8px;font-size:.78rem;font-family:inherit;cursor:pointer}
.bar-btn:active{background:#555}

/* TABS */
.tabs-wrap{background:#fff;border-bottom:1px solid #e8e8e8;overflow-x:auto;scrollbar-width:none}
.tabs-wrap::-webkit-scrollbar{display:none}
.tabs{display:flex;padding:8px 10px 0;gap:4px;min-width:max-content}
.tab{display:flex;flex-direction:column;align-items:center;padding:8px 14px 10px;border-radius:10px 10px 0 0;cursor:pointer;border-bottom:3px solid transparent;min-width:64px;transition:all .18s}
.tab:hover{background:#f7f7f7}
.tab.on{background:#f8f8f8;border-bottom-color:#1a1a2e}
.tab .m{font-size:.6rem;color:#bbb}
.tab .d{font-size:1.45rem;font-weight:700;line-height:1.1;color:#222}
.tab.on .d{color:#1a1a2e}
.tab .w{font-size:.6rem;color:#bbb;margin-top:1px}
.tab .b{margin-top:5px;background:#f0f0f0;color:#666;font-size:.6rem;padding:2px 8px;border-radius:10px;font-weight:500}
.tab.on .b{background:#e8e8f4;color:#1a1a2e}

/* CARD */
.card{background:#fff;margin:12px;border-radius:16px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.ch{padding:16px 18px 14px;border-bottom:1px solid #f5f5f5}
.tr{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.dt{font-size:1.12rem;font-weight:700;flex:1}
.ctag{font-size:.7rem;padding:3px 10px;border-radius:12px;background:#e3f2fd;color:#1565c0;font-weight:500}
.ibt{background:none;border:none;cursor:pointer;font-size:1rem;padding:4px 6px;border-radius:6px}
.ibt:hover{background:#f5f5f5}

.ir{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px;font-size:.84rem}
.lb{color:#bbb;width:36px;flex-shrink:0;font-size:.76rem;padding-top:1px}
.vl{flex:1;color:#1a1a1a;line-height:1.45}
.pin{cursor:pointer;font-size:.82rem}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:3px;padding:5px 11px;border-radius:20px;font-size:.74rem;background:#f5f5f5;color:#666;border:1.5px solid #ebebeb;cursor:pointer;user-select:none;transition:all .15s}
.chip.on{background:#1a1a2e;color:#fff;border-color:#1a1a2e}

/* MAP BAR */
.mb{padding:11px 18px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid #f5f5f5}
.mb span{font-size:.8rem;color:#888}
.gmb{background:#e8f0fe;color:#1a56db;border:none;padding:7px 14px;border-radius:10px;font-size:.76rem;font-family:inherit;font-weight:500;cursor:pointer;text-decoration:none;display:inline-block}
.gmb:active{background:#d0e2fd}
.imap{margin:0 18px 10px;border-radius:12px;overflow:hidden;height:185px}
.imap iframe{width:100%;height:100%;border:none}

/* STOPS */
.sl{padding:0 18px 10px}
.sr{display:flex;align-items:center;gap:10px;padding:11px 13px;background:#f8f8f8;border-radius:12px;margin-bottom:7px;cursor:pointer;transition:background .15s}
.sr:hover{background:#f0f0f0}
.sn{width:27px;height:27px;border-radius:50%;background:#1a1a2e;color:#fff;display:flex;align-items:center;justify-content:center;font-size:.74rem;font-weight:700;flex-shrink:0}
.st{font-size:.7rem;color:#bbb;width:38px;flex-shrink:0}
.snm{font-size:.86rem;font-weight:500;flex:1}
.sdl{background:none;border:none;cursor:pointer;color:#ccc;font-size:.82rem;padding:2px 5px;border-radius:5px;opacity:0;transition:opacity .15s}
.sr:hover .sdl{opacity:1}
.sdl:active{background:#ffeaea;color:#e53935}
.as{display:flex;align-items:center;gap:7px;width:100%;padding:11px 13px;background:none;border:1.5px dashed #ddd;border-radius:12px;color:#bbb;font-size:.8rem;font-family:inherit;cursor:pointer;margin-bottom:6px;transition:all .15s}
.as:hover{border-color:#bbb;color:#888}

/* CREDS */
.cs{padding:10px 18px 16px;border-top:1px solid #f5f5f5}
.cl{font-size:.76rem;color:#bbb;margin-bottom:8px;font-weight:500}
.cr{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#f8f8f8;border-radius:12px;margin-bottom:7px;cursor:pointer;transition:background .15s;text-decoration:none;color:inherit}
.cr:hover{background:#f0f0f0}
.ci{font-size:1.1rem;flex-shrink:0}
.cn{flex:1;min-width:0}
.cn .nm{font-size:.82rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cn .sb{font-size:.67rem;color:#bbb;margin-top:1px}
.cth{width:44px;height:32px;object-fit:cover;border-radius:6px;flex-shrink:0}
.cdl{background:none;border:none;cursor:pointer;color:#ccc;font-size:.8rem;padding:2px 5px;opacity:0;transition:opacity .15s}
.cr:hover .cdl{opacity:1}
.ac{display:flex;align-items:center;gap:7px;width:100%;padding:10px 12px;background:none;border:1.5px dashed #ddd;border-radius:12px;color:#bbb;font-size:.8rem;font-family:inherit;cursor:pointer;transition:all .15s}
.ac:hover{border-color:#bbb;color:#888}

/* SHEET */
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:flex-end;backdrop-filter:blur(2px)}
.ov.open{display:flex}
.sh{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:480px;margin:0 auto;padding:20px 20px 36px;max-height:92vh;overflow-y:auto;animation:up .24s ease}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.hd{width:36px;height:4px;background:#ddd;border-radius:2px;margin:0 auto 18px}
.shtl{font-size:1rem;font-weight:700;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #f0f0f0}
.fg{margin-bottom:13px}
.fg label{display:block;font-size:.74rem;color:#999;margin-bottom:4px;font-weight:500}
.fi,.fs,.ft{width:100%;padding:10px 12px;border:1.5px solid #e8e8e8;border-radius:10px;font-family:inherit;font-size:.87rem;color:#1a1a1a;background:#fff;outline:none;transition:border-color .15s}
.fi:focus,.ft:focus{border-color:#1a1a2e}
.ft{resize:vertical;min-height:72px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fc{display:flex;flex-wrap:wrap;gap:6px}
.fcp{padding:5px 13px;border-radius:20px;font-size:.76rem;cursor:pointer;background:#f5f5f5;color:#666;border:1.5px solid #ebebeb;transition:all .15s;user-select:none}
.fcp.on{background:#1a1a2e;color:#fff;border-color:#1a1a2e}
.sba{display:flex;gap:10px;margin-top:18px}
.bcx{flex:1;padding:12px;border:1.5px solid #e8e8e8;border-radius:12px;background:none;font-family:inherit;font-size:.87rem;color:#999;cursor:pointer}
.bsv{flex:2;padding:12px;background:#1a1a2e;color:#fff;border:none;border-radius:12px;font-family:inherit;font-size:.87rem;font-weight:700;cursor:pointer}
.bsv:active{background:#2a2a4e}
.img-row{display:flex;gap:10px;align-items:center;margin-top:6px}
.ulb{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 14px;border:1.5px dashed #ddd;border-radius:10px;cursor:pointer;color:#bbb;font-size:.7rem;flex-shrink:0}
.ulb span{font-size:1.1rem}
.pimg{width:100%;border-radius:10px;margin-top:8px;display:none;max-height:110px;object-fit:cover}

/* FAB */
.fab{position:fixed;bottom:24px;right:24px;width:50px;height:50px;border-radius:50%;background:#1a1a2e;color:#fff;border:none;font-size:1.4rem;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.22);display:flex;align-items:center;justify-content:center;z-index:50;transition:transform .18s}
.fab:active{transform:scale(.95)}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#1a1a2e;color:#fff;padding:10px 20px;border-radius:10px;font-size:.8rem;z-index:999;transition:transform .28s ease;pointer-events:none;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}

/* EMPTY */
.empty{text-align:center;padding:48px 20px;color:#bbb;font-size:.85rem;line-height:2}
</style>

</head>
<body>

<div class="bar">
  <span>✈️</span>
  <h1>2026 福岡之旅</h1>
  <div class="live"><div class="dot" id="dot"></div><span id="ltxt">連線中</span></div>
  <button class="bar-btn" onclick="openDay()">＋ 新增行程</button>
</div>

<div class="tabs-wrap"><div class="tabs" id="tabs"></div></div>
<div id="content"></div>
<button class="fab" onclick="openStop(null)">＋</button>

<!-- ── STOP SHEET ── -->

<div class="ov" id="ovStop">
  <div class="sh">
    <div class="hd"></div>
    <div class="shtl" id="stopTL">新增地點</div>
    <div class="fg"><label>地點名稱 *</label><input class="fi" id="sName" placeholder="例：博多駅"></div>
    <div class="f2">
      <div class="fg"><label>時間</label><input class="fi" type="time" id="sTime" value="09:00"></div>
      <div class="fg"><label>所屬天</label><select class="fs" id="sDay"></select></div>
    </div>
    <div class="fg"><label>Google Maps 關鍵字</label><input class="fi" id="sMap" placeholder="例：Hakata Station Fukuoka"></div>
    <div class="fg"><label>備註</label><textarea class="ft" id="sNote" placeholder="注意事項…"></textarea></div>
    <div class="sba">
      <button class="bcx" onclick="closeOv('ovStop')">取消</button>
      <button class="bsv" onclick="saveStop()">儲存</button>
    </div>
  </div>
</div>

<!-- ── CRED SHEET ── -->

<div class="ov" id="ovCred">
  <div class="sh">
    <div class="hd"></div>
    <div class="shtl">新增憑證</div>
    <div class="fg"><label>名稱 *</label><input class="fi" id="cName" placeholder="例：相鐵Fresa Inn福岡"></div>
    <div class="fg">
      <label>類型</label>
      <div class="fc" id="ctypes">
        <div class="fcp" data-t="機票" onclick="pickCT(this)">✈️ 機票</div>
        <div class="fcp on" data-t="訂房" onclick="pickCT(this)">🏨 訂房</div>
        <div class="fcp" data-t="餐廳" onclick="pickCT(this)">🍽 餐廳</div>
        <div class="fcp" data-t="景點" onclick="pickCT(this)">🎫 景點</div>
        <div class="fcp" data-t="交通" onclick="pickCT(this)">🚌 交通</div>
        <div class="fcp" data-t="文件" onclick="pickCT(this)">📄 文件</div>
        <div class="fcp" data-t="其他" onclick="pickCT(this)">🔗 其他</div>
      </div>
    </div>
    <div class="fg"><label>網址 URL</label><input class="fi" id="cUrl" placeholder="https://…"></div>
    <div class="fg"><label>說明文字</label><textarea class="ft" id="cDesc" placeholder="說明…" style="min-height:56px"></textarea></div>
    <div class="fg">
      <label>預覽圖片</label>
      <div class="img-row">
        <label class="ulb"><span>🗂</span>上傳<input type="file" accept="image/*" style="display:none" onchange="imgUp(event)"></label>
        <input class="fi" id="cImg" placeholder="或貼上圖片URL" oninput="prevImg(this.value)" style="flex:1">
      </div>
      <img class="pimg" id="credPrev">
    </div>
    <div class="sba">
      <button class="bcx" onclick="closeOv('ovCred')">取消</button>
      <button class="bsv" onclick="saveCred()">儲存</button>
    </div>
  </div>
</div>

<!-- ── DAY SHEET ── -->

<div class="ov" id="ovDay">
  <div class="sh">
    <div class="hd"></div>
    <div class="shtl" id="dayTL">新增行程天</div>
    <input type="hidden" id="dId">
    <div class="f2">
      <div class="fg"><label>日期</label><input class="fi" type="date" id="dDate"></div>
      <div class="fg"><label>城市 *</label><input class="fi" id="dCity" placeholder="例：福岡"></div>
    </div>
    <div class="fg"><label>今日目的地 / 主題</label><input class="fi" id="dDest" placeholder="例：太宰府・博多"></div>
    <div class="fg"><label>行程概要</label><input class="fi" id="dItin" placeholder="例：參拜天滿宮，博多拉麵"></div>
    <div class="fg"><label>住宿</label><input class="fi" id="dHotel" placeholder="例：Cross Hotel Fukuoka"></div>
    <div class="fg">
      <label>交通方式（可複選）</label>
      <div class="fc" id="tChips">
        <div class="fcp" data-v="電車" onclick="this.classList.toggle('on')">🚆 電車</div>
        <div class="fcp" data-v="巴士" onclick="this.classList.toggle('on')">🚌 巴士</div>
        <div class="fcp" data-v="計程車" onclick="this.classList.toggle('on')">🚕 計程車</div>
        <div class="fcp" data-v="步行" onclick="this.classList.toggle('on')">🚶 步行</div>
        <div class="fcp" data-v="飛機" onclick="this.classList.toggle('on')">✈️ 飛機</div>
        <div class="fcp" data-v="渡輪" onclick="this.classList.toggle('on')">⛴ 渡輪</div>
        <div class="fcp" data-v="租車" onclick="this.classList.toggle('on')">🚗 租車</div>
      </div>
    </div>
    <div class="sba">
      <button class="bcx" onclick="closeOv('ovDay')">取消</button>
      <button class="bsv" id="daySaveBtn" onclick="saveDay()">儲存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ════════════════════════════════════════════
//  CONFIG
// ════════════════════════════════════════════
const SB_URL = 'https://mklbhyinzgruetajxkvq.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1rbGJoeWluemdydWV0YWp4a3ZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ0NDMyNzksImV4cCI6MjA5MDAxOTI3OX0.XlQDwt4thOB7NH09f_fUkgHeMx-kR_Kw-SFQgPRR8V0';

const { createClient } = supabase;
const db = createClient(SB_URL, SB_KEY);

// ════════════════════════════════════════════
//  STATE  (全部用字串 id)
// ════════════════════════════════════════════
let days = [];        // 每筆 { id:string, day, date, city, dest, itin, hotel, transport, stops:string, creds:string, sort_order }
let curId = null;     // 目前選中的天數 id（字串）

// 編輯狀態
let editStopDayId = null, editStopIdx = null;
let editCredDayId = null, editCredIdx = null;
let mapDayId = null,  mapQuery = null;

const WD   = ['日','一','二','三','四','五','六'];
const TICO = {電車:'🚆',巴士:'🚌',計程車:'🚕',步行:'🚶',飛機:'✈️',渡輪:'⛴',租車:'🚗'};
const CICO = {機票:'✈️',訂房:'🏨',餐廳:'🍽',景點:'🎫',交通:'🚌',文件:'📄',其他:'🔗'};

// ════════════════════════════════════════════
//  NORMALIZE  確保 id 是字串、stops/creds 是字串
// ════════════════════════════════════════════
function norm(d) {
  return {
    ...d,
    id:    String(d.id),
    stops: Array.isArray(d.stops) ? JSON.stringify(d.stops) : (d.stops || '[]'),
    creds: Array.isArray(d.creds) ? JSON.stringify(d.creds) : (d.creds || '[]'),
  };
}
function pj(v) {
  if (Array.isArray(v)) return v;
  try { return JSON.parse(v) || []; } catch { return []; }
}

// ════════════════════════════════════════════
//  INIT
// ════════════════════════════════════════════
function showDbg(msg, isErr) { console.log((isErr?'ERR':'OK'), msg); }

async function init() {
  renderTabs();
  renderContent();

  showDbg('🔄 連接 Supabase 中…', false);

  try {
    const { data, error } = await db
      .from('trips').select('*').order('sort_order');

    if (error) {
          showDbg('❌ SELECT 錯誤: ' + JSON.stringify(error), true);
      throw error;
    }

        showDbg('✅ 取得 ' + (data||[]).length + ' 筆資料', false);
    days = (data || []).map(norm);
    showDbg('days[0]=' + JSON.stringify({id:days[0]?.id, day:days[0]?.day, city:days[0]?.city}), false);
    showDbg('curId=' + curId + ' type=' + typeof curId, false);

    if (days.length === 0) {
      showDbg('📝 第一次使用，寫入示範資料…', false);
      await seedDemo();
      showDbg('✅ 示範資料寫入完成，共 ' + days.length + ' 天', false);
    }
    setLive(true);
  } catch (e) {
        showDbg('❌ 連線失敗: ' + (e?.message || JSON.stringify(e)) + ' → 使用離線模式', true);
    if (days.length === 0) seedLocal();
    setLive(false);
  }

  if (days.length > 0) curId = days[0].id;
  showDbg('最終 curId=' + curId + ' days數=' + days.length, false);
  renderTabs();
  renderContent();

  db.channel('trips-live')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'trips' }, async () => {
      const { data } = await db.from('trips').select('*').order('sort_order');
      if (data) {
        const prevId = curId;
        days = data.map(norm);
        curId = days.find(x => x.id === prevId) ? prevId : (days[0]?.id || null);
        renderTabs();
        renderContent();
        showToast('🔄 已同步');
      }
    })
    .subscribe(s => setLive(s === 'SUBSCRIBED'));
}

function setLive(ok) {
  document.getElementById('dot').className  = 'dot' + (ok ? '' : ' off');
  document.getElementById('ltxt').textContent = ok ? '已連線' : '離線';
}

// ════════════════════════════════════════════
//  DEMO DATA
// ════════════════════════════════════════════
function makeDemoRows() {
  return [
    { day:'第1天', date:'2026-07-27', city:'福岡', dest:'福岡機場 → 博多', itin:'搭機抵達，博多夜遊', hotel:'相鐵Fresa Inn博多駅前', transport:'飛機,電車', note:'', sort_order:1,
      stops: JSON.stringify([{name:'高雄小港機場',time:'06:00',map:'Kaohsiung International Airport',note:'提早2小時'},{name:'福岡國際機場',time:'11:30',map:'Fukuoka Airport',note:'買IC卡'},{name:'博多駅',time:'13:00',map:'Hakata Station Fukuoka',note:''},{name:'中洲屋台',time:'18:30',map:'Nakasu Yatai Fukuoka',note:'豚骨拉麵'}]),
      creds: JSON.stringify([{type:'機票',name:'台灣虎航 IT234 高雄→福岡',url:'#',desc:'06:00出發',img:''}]) },
    { day:'第2天', date:'2026-07-28', city:'太宰府', dest:'太宰府天滿宮', itin:'參拜天滿宮，遊柳川', hotel:'相鐵Fresa Inn博多駅前', transport:'電車,渡輪', note:'', sort_order:2,
      stops: JSON.stringify([{name:'博多駅',time:'08:30',map:'Hakata Station',note:''},{name:'太宰府天滿宮',time:'09:30',map:'Dazaifu Tenmangu Shrine',note:'買梅枝餅'},{name:'柳川川下り',time:'14:00',map:'Yanagawa boat tour',note:'¥1500'}]),
      creds: JSON.stringify([]) },
    { day:'第3天', date:'2026-07-29', city:'糸島', dest:'糸島海岸', itin:'二見浦夫妻岩，海邊咖啡廳', hotel:'相鐵Fresa Inn博多駅前', transport:'電車,步行', note:'', sort_order:3,
      stops: JSON.stringify([{name:'筑前前原駅',time:'09:00',map:'Chikuzen-Maebaru Station',note:''},{name:'二見浦夫妻岩',time:'10:30',map:'Meoto Iwa Itoshima',note:''},{name:'糸島牡蠣小屋',time:'12:30',map:'Itoshima oyster hut',note:''}]),
      creds: JSON.stringify([]) },

      stops: JSON.stringify([{name:'天神地下街',time:'10:00',map:'Tenjin Underground Shopping',note:''},{name:'中洲屋台',time:'17:30',map:'Nakasu Yatai Fukuoka',note:''},{name:'福岡機場 出發',time:'21:00',map:'Fukuoka Airport International',note:'提早3小時'}]),
      creds: JSON.stringify([{type:'機票',name:'台灣虎航 IT235 福岡→高雄',url:'#',desc:'21:00出發',img:''}]) },

}

async function seedDemo() {
  const rows = makeDemoRows();
  for (const r of rows) {
    try {
      const { data, error } = await db.from('trips').insert(r).select();
      if (!error && Array.isArray(data) && data.length > 0) {
        days.push(norm(data[0]));
      }
    } catch(e) { console.warn('seedDemo insert error:', e); }
  }
  // 如果 insert 後 days 還是空，直接 query 一次
  if (days.length === 0) {
    try {
      const { data } = await db.from('trips').select('*').order('sort_order');
      days = (data || []).map(norm);
    } catch(e) {}
  }
}

function seedLocal() {
  days = makeDemoRows().map((r, i) => norm({ ...r, id: String(i + 1) }));
}

// ════════════════════════════════════════════
//  RENDER
// ════════════════════════════════════════════
function renderTabs() {
  document.getElementById('tabs').innerHTML = days.map(d => {
    const dt  = d.date ? new Date(d.date + 'T00:00:00') : null;
    const mon = dt ? `${dt.getMonth()+1}/${dt.getDate()}` : d.day;
    const dn  = dt ? String(dt.getDate()).padStart(2,'0') : d.day.replace(/[^\d]/g,'').padStart(2,'0');
    const wd  = dt ? `(${WD[dt.getDay()]})` : '';
    return `<div class="tab ${d.id === curId ? 'on' : ''}" onclick="selDay('${d.id}')">
      <span class="m">${mon}</span>
      <span class="d">${dn}</span>
      <span class="w">${wd}</span>
      <span class="b">${d.city || ''}</span>
    </div>`;
  }).join('');
}

function renderContent() {
  const el = document.getElementById('content');
  const d  = days.find(x => x.id === curId);
  if (!d) {
    el.innerHTML = `<div class="empty">暫無行程<br>點擊右上角「＋ 新增行程」開始吧！</div>`;
    return;
  }
  const stops = pj(d.stops);
  const creds = pj(d.creds);
  const trans = (d.transport || '').split(',').filter(Boolean);
  const dt    = d.date ? new Date(d.date + 'T00:00:00') : null;
  const wd    = dt ? WD[dt.getDay()] : '';
  const mUrl  = stops.length
    ? 'https://www.google.com/maps/dir/' + stops.map(s => encodeURIComponent(s.map || s.name)).join('/')
    : 'https://maps.google.com';

  el.innerHTML = `
  <div class="card">
    <div class="ch">
      <div class="tr">
        <span class="dt">${d.day}${wd ? `(${wd})` : ''}</span>
        <span class="ctag">${d.city || ''}</span>
        <button class="ibt" onclick="openDay('${d.id}')">✏️</button>
        <button class="ibt" onclick="delDay('${d.id}')">🗑</button>
      </div>
      <div class="ir"><span class="lb">目的地</span><span class="vl">${d.dest || '—'}${d.dest ? ` <span class="pin" onclick="showMap('${esc(d.dest+' '+d.city)}','${d.id}')">📍</span>` : ''}</span></div>
      <div class="ir"><span class="lb">行程</span><span class="vl">${d.itin || '—'}</span></div>
      <div class="ir"><span class="lb">住宿</span><span class="vl">${d.hotel || '—'}${d.hotel ? ` <span class="pin" onclick="showMap('${esc(d.hotel)}','${d.id}')">📍</span>` : ''}</span></div>
      <div class="ir">
        <span class="lb">交通</span>
        <div class="vl"><div class="chips">${Object.keys(TICO).map(t =>
          `<span class="chip ${trans.includes(t)?'on':''}" onclick="togT('${d.id}','${t}')">${TICO[t]} ${t}</span>`
        ).join('')}</div></div>
      </div>
    </div>
    <div class="mb">
      <span>📍 當日行程地點</span>
      <a class="gmb" href="${mUrl}" target="_blank">Google Maps 路線 ↗</a>
    </div>
    ${mapDayId === d.id && mapQuery ? `<div class="imap"><iframe src="https://maps.google.com/maps?q=${mapQuery}&output=embed&z=15" allowfullscreen></iframe></div>` : ''}
    <div class="sl">
      ${stops.map((s,i) => `
      <div class="sr" onclick="showMap('${esc(s.map||s.name)}','${d.id}')">
        <div class="sn">${i+1}</div>
        <span class="st">${s.time||''}</span>
        <span class="snm">${s.name}</span>
        <button class="sdl" onclick="event.stopPropagation();delStop('${d.id}',${i})">✕</button>
      </div>`).join('')}
      <button class="as" onclick="openStop('${d.id}')">＋ 新增地點</button>
    </div>
    <div class="cs">
      <div class="cl">憑證</div>
      ${creds.map((c,i) => `
      <a class="cr" href="${c.url||'#'}" ${c.url&&c.url!=='#'?'target="_blank"':''}>
        <span class="ci">${CICO[c.type]||'🔗'}</span>
        <div class="cn"><div class="nm">${c.name}</div><div class="sb">${c.type}${c.desc?' · '+c.desc:''}</div></div>
        ${c.img?`<img class="cth" src="${c.img}" onerror="this.style.display='none'">` : ''}
        <button class="cdl" onclick="event.preventDefault();event.stopPropagation();delCred('${d.id}',${i})">✕</button>
      </a>`).join('')}
      <button class="ac" onclick="openCred('${d.id}')">＋ 新增憑證</button>
    </div>
  </div>`;
}

function selDay(id) {
  curId = String(id);
  mapDayId = null; mapQuery = null;
  renderTabs();
  renderContent();
}

// ════════════════════════════════════════════
//  MAP
// ════════════════════════════════════════════
function showMap(q, dayId) {
  if (mapDayId === dayId && mapQuery === q) { mapDayId = null; mapQuery = null; }
  else { mapDayId = dayId; mapQuery = q; }
  renderContent();
}
function esc(s) { return encodeURIComponent(s); }

// ════════════════════════════════════════════
//  TRANSPORT TOGGLE
// ════════════════════════════════════════════
async function togT(dayId, t) {
  const d = days.find(x => x.id === dayId); if (!d) return;
  let arr = (d.transport || '').split(',').filter(Boolean);
  arr = arr.includes(t) ? arr.filter(x => x !== t) : [...arr, t];
  d.transport = arr.join(',');
  renderContent();
  await db.from('trips').update({ transport: d.transport }).eq('id', dayId).catch(console.warn);
}

// ════════════════════════════════════════════
//  DAY CRUD
// ════════════════════════════════════════════
function openDay(id) {
  const d = id ? days.find(x => x.id === String(id)) : null;
  document.getElementById('dId').value       = d?.id || '';
  document.getElementById('dayTL').textContent = d ? '編輯行程天' : '新增行程天';
  document.getElementById('dDate').value     = d?.date  || '';
  document.getElementById('dCity').value     = d?.city  || '';
  document.getElementById('dDest').value     = d?.dest  || '';
  document.getElementById('dItin').value     = d?.itin  || '';
  document.getElementById('dHotel').value    = d?.hotel || '';
  const active = (d?.transport || '').split(',');
  document.querySelectorAll('#tChips .fcp').forEach(c =>
    c.classList.toggle('on', active.includes(c.dataset.v)));
  document.getElementById('ovDay').classList.add('open');
}

async function saveDay() {
  const city = document.getElementById('dCity').value.trim();
  if (!city) { showToast('請輸入城市名稱'); return; }

  const id = document.getElementById('dId').value;
  const transport = [...document.querySelectorAll('#tChips .fcp.on')]
    .map(c => c.dataset.v).join(',');
  const payload = {
    date:      document.getElementById('dDate').value,
    city,
    dest:      document.getElementById('dDest').value.trim(),
    itin:      document.getElementById('dItin').value.trim(),
    hotel:     document.getElementById('dHotel').value.trim(),
    transport,
  };

  // 禁用按鈕防止重複點擊
  const btn = document.getElementById('daySaveBtn');
  btn.disabled = true; btn.textContent = '儲存中…';

  if (id) {
    // ── 編輯 ──
    await db.from('trips').update(payload).eq('id', id).catch(console.warn);
    const d = days.find(x => x.id === id);
    if (d) Object.assign(d, payload);
    closeOv('ovDay');
    showToast('✅ 已儲存');
    renderTabs(); renderContent();
  } else {
    // ── 新增 ──
    const order = days.length + 1;
    const row = {
      ...payload,
      day:        `第${order}天`,
      note:       '',
      stops:      '[]',
      creds:      '[]',
      sort_order: order,
    };
    let newRow = null;
    try {
      showDbg('📝 新增中…', false);
      // 只送資料庫確定有的欄位，stops/creds 讓資料庫用 default '[]'
      const safeRow = {
        day: row.day, date: row.date, city: row.city,
        dest: row.dest, itin: row.itin, hotel: row.hotel,
        transport: row.transport, note: row.note,
        sort_order: row.sort_order,
      };
      const { data, error } = await db.from('trips').insert(safeRow).select();
      if (error) { showDbg('❌ INSERT 錯誤: ' + JSON.stringify(error), true); throw error; }
      newRow = Array.isArray(data) && data.length > 0 ? data[0] : null;
      showDbg('✅ INSERT 成功 id=' + newRow?.id, false);
    } catch (e) {
      showDbg('❌ INSERT 失敗: ' + (e?.message||JSON.stringify(e)), true);
      console.warn('insert error:', e);
    }
    if (newRow) {
      days.push(norm(newRow));
      curId = String(newRow.id);
    } else {
      // 離線 fallback
      const fakeId = String(Date.now());
      days.push(norm({ ...row, id: fakeId }));
      curId = fakeId;
    }
    closeOv('ovDay');
    showToast('✅ 已新增');
    renderTabs(); renderContent();
  }

  btn.disabled = false; btn.textContent = '儲存';
}

async function delDay(id) {
  if (!confirm('確定刪除這天的行程？')) return;
  await db.from('trips').delete().eq('id', id).catch(console.warn);
  days = days.filter(x => x.id !== String(id));
  curId = days.length ? days[0].id : null;
  renderTabs(); renderContent();
  showToast('🗑 已刪除');
}

// ════════════════════════════════════════════
//  STOP CRUD
// ════════════════════════════════════════════
function openStop(dayId, idx) {
  editStopDayId = dayId ? String(dayId) : curId;
  editStopIdx   = idx !== undefined ? idx : null;
  const d = days.find(x => x.id === editStopDayId);
  const stops = d ? pj(d.stops) : [];
  const s = editStopIdx !== null ? stops[editStopIdx] : null;
  document.getElementById('stopTL').textContent = s ? '編輯地點' : '新增地點';
  document.getElementById('sName').value = s?.name || '';
  document.getElementById('sTime').value = s?.time || '09:00';
  document.getElementById('sMap').value  = s?.map  || '';
  document.getElementById('sNote').value = s?.note || '';
  const sel = document.getElementById('sDay');
  sel.innerHTML = days.map(d2 =>
    `<option value="${d2.id}" ${d2.id === editStopDayId ? 'selected' : ''}>${d2.day} · ${d2.city}</option>`
  ).join('');
  document.getElementById('ovStop').classList.add('open');
}

async function saveStop() {
  const name = document.getElementById('sName').value.trim();
  if (!name) { showToast('請輸入地點名稱'); return; }
  const dayId = document.getElementById('sDay').value;
  const d = days.find(x => x.id === dayId);
  if (!d) { showToast('找不到對應天數'); return; }
  const stops = pj(d.stops);
  const s = { name, time: document.getElementById('sTime').value, map: document.getElementById('sMap').value.trim(), note: document.getElementById('sNote').value.trim() };
  if (editStopIdx !== null) stops[editStopIdx] = s; else stops.push(s);
  stops.sort((a, b) => (a.time || '').localeCompare(b.time || ''));
  d.stops = JSON.stringify(stops);
  await db.from('trips').update({ stops: d.stops }).eq('id', dayId).catch(console.warn);
  closeOv('ovStop'); showToast('✅ 地點已儲存'); renderContent();
}

async function delStop(dayId, idx) {
  const d = days.find(x => x.id === String(dayId)); if (!d) return;
  const stops = pj(d.stops); stops.splice(idx, 1);
  d.stops = JSON.stringify(stops);
  await db.from('trips').update({ stops: d.stops }).eq('id', dayId).catch(console.warn);
  renderContent(); showToast('🗑 地點已刪除');
}

// ════════════════════════════════════════════
//  CRED CRUD
// ════════════════════════════════════════════
function openCred(dayId, idx) {
  editCredDayId = String(dayId);
  editCredIdx   = idx !== undefined ? idx : null;
  const d = days.find(x => x.id === editCredDayId);
  const creds = d ? pj(d.creds) : [];
  const c = editCredIdx !== null ? creds[editCredIdx] : null;
  document.getElementById('cName').value = c?.name || '';
  document.getElementById('cUrl').value  = c?.url  || '';
  document.getElementById('cDesc').value = c?.desc || '';
  document.getElementById('cImg').value  = c?.img  || '';
  prevImg(c?.img || '');
  document.querySelectorAll('#ctypes .fcp').forEach(el =>
    el.classList.toggle('on', el.dataset.t === (c?.type || '訂房')));
  document.getElementById('ovCred').classList.add('open');
}

function pickCT(el) {
  document.querySelectorAll('#ctypes .fcp').forEach(e => e.classList.remove('on'));
  el.classList.add('on');
}

async function saveCred() {
  const name = document.getElementById('cName').value.trim();
  if (!name) { showToast('請輸入憑證名稱'); return; }
  const typeEl = document.querySelector('#ctypes .fcp.on');
  const c = { name, type: typeEl?.dataset.t || '其他', url: document.getElementById('cUrl').value.trim(), desc: document.getElementById('cDesc').value.trim(), img: document.getElementById('cImg').value.trim() };
  const d = days.find(x => x.id === editCredDayId);
  if (!d) { showToast('找不到對應天數'); return; }
  const creds = pj(d.creds);
  if (editCredIdx !== null) creds[editCredIdx] = c; else creds.push(c);
  d.creds = JSON.stringify(creds);
  await db.from('trips').update({ creds: d.creds }).eq('id', editCredDayId).catch(console.warn);
  closeOv('ovCred'); showToast('✅ 憑證已儲存'); renderContent();
}

async function delCred(dayId, idx) {
  const d = days.find(x => x.id === String(dayId)); if (!d) return;
  const creds = pj(d.creds); creds.splice(idx, 1);
  d.creds = JSON.stringify(creds);
  await db.from('trips').update({ creds: d.creds }).eq('id', dayId).catch(console.warn);
  renderContent(); showToast('🗑 憑證已刪除');
}

function imgUp(e) {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = ev => { document.getElementById('cImg').value = ev.target.result; prevImg(ev.target.result); };
  r.readAsDataURL(f);
}
function prevImg(src) {
  const img = document.getElementById('credPrev');
  img.src = src; img.style.display = src ? 'block' : 'none';
}

// ════════════════════════════════════════════
//  UTILS
// ════════════════════════════════════════════
function closeOv(id) { document.getElementById(id).classList.remove('open'); }
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// 點 overlay 背景關閉
['ovStop','ovCred','ovDay'].forEach(id => {
  document.getElementById(id).addEventListener('click', e => {
    if (e.target === e.currentTarget) closeOv(id);
  });
});

// ════════════════════════════════════════════
//  START
// ════════════════════════════════════════════
init();
</script>
