<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>福岡吃貨團 🍜</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background: #F9FAFB; color: #1F2937; }
        
        /* 日期導覽列 */
        .date-item { @apply flex-none w-16 h-24 rounded-[20px] bg-white border-2 border-slate-100 flex flex-col items-center justify-center transition-all duration-300 cursor-pointer; }
        .date-item.active { @apply border-orange-500 bg-orange-50 ring-4 ring-orange-50/50 scale-105; }
        .date-item.active span { @apply text-orange-600; }

        /* 行程卡片 */
        .stop-card { @apply bg-white p-4 rounded-2xl mb-4 shadow-sm border border-slate-50 flex gap-4 relative overflow-hidden; }
        .stop-card::before { content: ''; @apply absolute left-0 top-0 bottom-0 w-1 bg-slate-800; }
        
        /* 交通標籤 */
        .trans-tag { @apply px-3 py-1.5 rounded-xl border-2 border-slate-100 text-[11px] font-bold transition-all bg-white text-slate-400 cursor-pointer; }
        .trans-tag.selected { @apply border-slate-800 bg-slate-800 text-white shadow-md; }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .drag-handle { @apply cursor-grab text-slate-200 hover:text-slate-400 p-2; }
    </style>
</head>
<body class="pb-24">

<div class="max-w-md mx-auto min-h-screen bg-white shadow-2xl relative">
    <header class="p-6 flex justify-between items-center sticky top-0 bg-white/90 backdrop-blur-md z-50 border-b border-slate-50">
        <div>
            <h1 class="text-2xl font-[900] tracking-tighter text-slate-900">FUKUOKA <span class="text-orange-500">2026</span></h1>
            <p class="text-[10px] font-bold text-slate-400 tracking-[0.2em] uppercase">Foodie Adventure</p>
        </div>
        <div class="flex gap-2">
            <button onclick="addDay()" class="w-10 h-10 rounded-full bg-slate-900 text-white flex items-center justify-center shadow-lg active:scale-90 transition-all">＋</button>
            <button onclick="save()" class="px-4 py-2 bg-orange-500 text-white text-[11px] font-[900] rounded-xl shadow-lg shadow-orange-100 uppercase">Save</button>
        </div>
    </header>

    <div class="flex overflow-x-auto p-6 gap-4 no-scrollbar bg-white" id="date-nav"></div>

    <main id="content" class="px-6 py-4">
        <div class="animate-pulse flex flex-col gap-4">
            <div class="h-32 bg-slate-100 rounded-3xl"></div>
            <div class="h-32 bg-slate-100 rounded-3xl"></div>
        </div>
    </main>
</div>

<script>
// ======= ⚙️ 填入你的資訊 =======
const SB_URL = "https://mklbhyinzgruetajxkvq.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1rbGJoeWluemdydWV0YWp4a3ZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ0NDMyNzksImV4cCI6MjA5MDAxOTI3OX0.XlQDwt4thOB7NH09f_fUkgHeMx-kR_Kw-SFQgPRR8V0";
const START_DATE = '2026-07-27';
// =============================

const _db = supabase.createClient(SB_URL, SB_KEY);
const tripId = location.hash.replace("#","") || "fukuoka_main";
let days = [];
let current = 0;

async function load() {
    let { data } = await _db.from("trips").select("*").eq("trip_id", tripId).order("day_num");
    days = data || [];
    if(days.length === 0) await addDay();
    render();
}

function render() {
    // 渲染日期導覽
    const nav = document.getElementById("date-nav");
    nav.innerHTML = "";
    const startDate = new Date(START_DATE);
    const weeks = ['SUN','MON','TUE','WED','THU','FRI','SAT'];

    days.forEach((day, i) => {
        const cur = new Date(startDate);
        cur.setDate(startDate.getDate() + i);
        const active = (i === current) ? 'active' : '';
        nav.innerHTML += `
            <div class="date-item ${active}" onclick="selectDay(${i})">
                <span class="text-[9px] font-black">${weeks[cur.getDay()]}</span>
                <span class="text-2xl font-[900] my-1">${cur.getDate()}</span>
                <span class="text-[9px] font-black opacity-40">${cur.getMonth()+1}月</span>
            </div>
        `;
    });

    const c = document.getElementById("content");
    let day = days[current];
    const transList = ["電車", "巴士", "計程車", "步行", "飛機"];

    c.innerHTML = `
        <div class="space-y-6">
            <div class="bg-slate-50 p-6 rounded-[32px] space-y-4 border border-slate-100">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-[9px] font-black text-slate-400 uppercase">Location</label>
                        <input class="w-full bg-transparent font-bold text-slate-700" value="${day.city||''}" placeholder="地區 (如: 天神)" onchange="update('city',this.value)">
                    </div>
                    <div>
                        <label class="text-[9px] font-black text-slate-400 uppercase">Focus</label>
                        <input class="w-full bg-transparent font-bold text-slate-700" value="${day.destination||''}" placeholder="主要標題" onchange="update('destination',this.value)">
                    </div>
                </div>
                <div>
                    <label class="text-[9px] font-black text-slate-400 uppercase">Stay 🏨</label>
                    <input class="w-full bg-transparent font-bold text-slate-700" value="${day.accommodation||''}" placeholder="住宿飯店名稱" onchange="update('accommodation',this.value)">
                </div>
            </div>

            <div>
                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-3">Transport Options</label>
                <div class="flex flex-wrap gap-2">
                    ${transList.map(t => `
                        <div class="trans-tag ${day.transport_tags?.includes(t)?'selected':''}" onclick="toggleTrans('${t}')">${t}</div>
                    `).join('')}
                    <input class="flex-1 min-w-[100px] border-none bg-slate-50 rounded-xl px-3 py-1.5 text-[10px] font-bold" value="${day.transport_custom||''}" placeholder="其他方式..." onchange="update('transport_custom',this.value)">
                </div>
            </div>

            <div>
                <div class="flex justify-between items-center mb-4">
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Schedule</label>
                    <button onclick="addStop()" class="text-blue-600 text-[10px] font-black bg-blue-50 px-3 py-1.5 rounded-full">+ 新增景點</button>
                </div>
                <div id="list">
                    ${(day.stops || []).map((s,i) => `
                        <div class="stop-card">
                            <div class="drag-handle"><i class="fa-solid fa-ellipsis-vertical"></i></div>
                            <div class="flex-1 space-y-2">
                                <div class="flex gap-2">
                                    <input class="w-16 bg-slate-50 text-[10px] font-black p-2 rounded-lg" value="${s.time||''}" placeholder="09:00" onchange="updateStop(${i},'time',this.value)">
                                    <input class="flex-1 bg-slate-50 text-sm font-bold p-2 rounded-lg" value="${s.name||''}" placeholder="景點或餐廳名稱" onchange="updateStop(${i},'name',this.value)">
                                </div>
                            </div>
                            <button onclick="removeStop(${i})" class="text-slate-200 hover:text-red-400 transition-colors"><i class="fa-solid fa-circle-minus"></i></button>
                        </div>
                    `).join('')}
                </div>
            </div>

            <div class="pt-6 border-t border-dashed border-slate-200">
                <div class="flex justify-between items-center mb-4">
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Vouchers & Links</label>
                    <button onclick="addVoucher()" class="text-purple-600 text-[10px] font-black bg-purple-50 px-3 py-1.5 rounded-full">+ 新增憑證</button>
                </div>
                <div class="space-y-2">
                    ${(day.vouchers || []).map((v,i) => `
                        <div class="flex gap-2 items-center bg-slate-50 p-2 rounded-xl">
                            <input class="w-24 bg-white text-[10px] font-bold p-2 rounded-lg" value="${v.title||''}" placeholder="如: 飯店確認" onchange="updateVoucher(${i},'title',this.value)">
                            <input class="flex-1 bg-white text-[10px] text-blue-500 p-2 rounded-lg" value="${v.url||''}" placeholder="http://..." onchange="updateVoucher(${i},'url',this.value)">
                            ${v.url ? `<a href="${v.url}" target="_blank" class="text-slate-400 p-1"><i class="fa-solid fa-link text-xs"></i></a>` : ''}
                            <button onclick="removeVoucher(${i})" class="text-slate-200"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                    `).join('')}
                </div>
            </div>

            <button onclick="deleteDay()" class="w-full py-10 text-slate-300 text-[10px] font-bold hover:text-red-400 transition-all uppercase tracking-widest">Remove This Day</button>
        </div>
    `;

    // 拖曳功能
    new Sortable(document.getElementById("list"), {
        handle: '.drag-handle',
        animation: 150,
        onEnd: (e) => {
            const moved = day.stops.splice(e.oldIndex, 1)[0];
            day.stops.splice(e.newIndex, 0, moved);
            save(); 
        }
    });
}

// --- 邏輯函數 ---
function selectDay(i) { current = i; render(); }
function update(k, v) { days[current][k] = v; }

function toggleTrans(tag) {
    if(!days[current].transport_tags) days[current].transport_tags = [];
    let tags = days[current].transport_tags;
    if(tags.includes(tag)) tags = tags.filter(t => t !== tag);
    else tags.push(tag);
    days[current].transport_tags = tags;
    render();
}

function addStop() { if(!days[current].stops) days[current].stops=[]; days[current].stops.push({time:"", name:""}); render(); }
function updateStop(i, k, v) { days[current].stops[i][k] = v; }
function removeStop(i) { days[current].stops.splice(i, 1); render(); }

function addVoucher() { if(!days[current].vouchers) days[current].vouchers=[]; days[current].vouchers.push({title:"", url:""}); render(); }
function updateVoucher(i, k, v) { days[current].vouchers[i][k] = v; }
function removeVoucher(i) { days[current].vouchers.splice(i, 1); render(); }

async function addDay() {
    const newDay = { trip_id: tripId, day_num: days.length + 1, stops: [], vouchers: [], transport_tags: [], sort_order: days.length };
    days.push(newDay);
    current = days.length - 1;
    await save(); render();
}

async function deleteDay() {
    if(!confirm("確定要刪除？")) return;
    if(days[current].id) await _db.from("trips").delete().eq("id", days[current].id);
    days.splice(current, 1);
    current = 0;
    load();
}

async function save() {
    for(let d of days) {
        const { id, ...payload } = d;
        if(!id) await _db.from("trips").insert(payload);
        else await _db.from("trips").upsert(d);
    }
    console.log("Saved!");
}

load();
</script>

</body>
</html>
