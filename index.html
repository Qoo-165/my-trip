<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>福岡吃貨團之旅 🍜</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f8f9fa; }
        .date-item.active { background: #fffcf0; border-color: #f59e0b !important; color: #b45309; transform: scale(1.05); }
        .trans-btn { @apply px-4 py-2 rounded-xl border border-slate-200 text-xs font-bold transition-all bg-white text-slate-500; }
        .trans-btn.selected { @apply bg-blue-600 border-blue-600 text-white shadow-md; }
        .poi-row { @apply flex gap-2 mb-3 items-center animate-fadeIn; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fadeIn { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="pb-32">

    <header class="bg-white/90 backdrop-blur-md px-6 py-5 flex justify-between items-center sticky top-0 z-40 shadow-sm">
        <div class="flex items-center gap-3">
            <span class="text-3xl">🍜</span>
            <div>
                <h1 class="text-xl font-black text-slate-900">福岡吃貨團之旅</h1>
                <p class="text-[10px] text-green-500 font-bold">● 已連線同步</p>
            </div>
        </div>
        <button onclick="showModal()" class="bg-slate-900 text-white text-xs px-5 py-3 rounded-2xl font-black shadow-lg">+ 新增行程</button>
    </header>

    <div class="bg-white border-b overflow-x-auto flex px-6 py-5 gap-4 no-scrollbar sticky top-[85px] z-30" id="date-nav"></div>

    <main class="p-6 max-w-2xl mx-auto" id="main-content">
        <div class="text-center py-20 text-slate-300 font-bold italic">正在開啟你的美食地圖...</div>
    </main>

    <div id="modal" class="fixed inset-0 bg-black/60 hidden z-50 flex items-end sm:items-center justify-center backdrop-blur-sm">
        <div class="bg-white w-full max-w-xl rounded-t-[40px] p-8 shadow-2xl max-h-[95vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-2xl font-black text-slate-800">編輯行程詳細</h3>
                <button onclick="hideModal()" class="text-slate-300 p-2"><i class="fa-solid fa-circle-xmark text-2xl"></i></button>
            </div>
            
            <div class="space-y-6 text-sm">
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1"><label class="text-[10px] font-bold text-slate-400 ml-1">地區 (如: 博多)</label><input type="text" id="in-city" class="w-full bg-slate-50 border-none p-4 rounded-2xl outline-none focus:ring-2 ring-orange-100"></div>
                    <div class="space-y-1"><label class="text-[10px] font-bold text-slate-400 ml-1">主目的地</label><input type="text" id="in-dest" class="w-full bg-slate-50 border-none p-4 rounded-2xl outline-none focus:ring-2 ring-orange-100"></div>
                </div>

                <div class="space-y-1"><label class="text-[10px] font-bold text-slate-400 ml-1">住宿飯店 🏨</label><input type="text" id="in-hotel" class="w-full bg-slate-50 border-none p-4 rounded-2xl outline-none"></div>

                <div>
                    <label class="text-[10px] font-bold text-slate-400 block mb-2 ml-1">交通工具 (可複選)</label>
                    <div class="flex flex-wrap gap-2 mb-3" id="trans-tags-container">
                        <button class="trans-btn" onclick="toggleTrans(this)">電車</button>
                        <button class="trans-btn" onclick="toggleTrans(this)">巴士</button>
                        <button class="trans-btn" onclick="toggleTrans(this)">計程車</button>
                        <button class="trans-btn" onclick="toggleTrans(this)">步行</button>
                        <button class="trans-btn" onclick="toggleTrans(this)">飛機</button>
                    </div>
                    <input type="text" id="in-trans-custom" placeholder="還有其他的嗎？自行填寫..." class="w-full bg-slate-50 border-none p-3 rounded-xl outline-none text-xs">
                </div>

                <div>
                    <div class="flex justify-between items-center mb-3">
                        <label class="text-[10px] font-bold text-slate-400 ml-1">📍 行程地點列表</label>
                        <button onclick="addPoiRow()" class="text-blue-600 font-black text-[11px] bg-blue-50 px-3 py-1 rounded-full">+ 增加地點</button>
                    </div>
                    <div id="poi-container" class="space-y-1"></div>
                </div>

                <div class="space-y-1"><label class="text-[10px] font-bold text-slate-400 ml-1">Google Maps 綜合路線連結</label><input type="text" id="in-map" class="w-full bg-slate-50 border-none p-4 rounded-2xl outline-none" placeholder="貼上 Google Maps 分享網址"></div>

                <button onclick="saveItem()" class="w-full bg-orange-500 text-white py-5 rounded-3xl font-black text-lg shadow-xl shadow-orange-100 hover:bg-orange-600 transition-all">儲存並同步到雲端</button>
            </div>
        </div>
    </div>

    <script>
        // ======= ⚙️ 核心設定區 =======
        const SB_URL = 'https://mklbhyinzgruetajxkvq.supabase.co'; 
        const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1rbGJoeWluemdydWV0YWp4a3ZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ0NDMyNzksImV4cCI6MjA5MDAxOTI3OX0.XlQDwt4thOB7NH09f_fUkgHeMx-kR_Kw-SFQgPRR8V0'; // 👈 [重要] 請貼上你的 Anon Key
        const TOTAL_DAYS = 5; 
        const START_DATE = '2026-07-27'; 
        // ============================

        const _supabase = supabase.createClient(SB_URL, SB_KEY);
        let currentDay = 1;
        let selectedTrans = [];

        function toggleTrans(btn) {
            btn.classList.toggle('selected');
            const val = btn.innerText;
            if(selectedTrans.includes(val)) selectedTrans = selectedTrans.filter(t => t !== val);
            else selectedTrans.push(val);
        }

        function addPoiRow(time = '', name = '') {
            const container = document.getElementById('poi-container');
            const div = document.createElement('div');
            div.className = 'poi-row';
            div.innerHTML = `
                <input type="text" placeholder="時間" value="${time}" class="w-20 bg-slate-50 border-none p-3 rounded-xl outline-none text-xs poi-time font-bold">
                <input type="text" placeholder="地點名稱" value="${name}" class="flex-1 bg-slate-50 border-none p-3 rounded-xl outline-none text-xs poi-name font-bold">
                <button onclick="this.parentElement.remove()" class="text-slate-300 hover:text-red-500 px-2 transition-colors"><i class="fa-solid fa-trash-can"></i></button>
            `;
            container.appendChild(div);
        }

        function initDateNav() {
            const nav = document.getElementById('date-nav');
            nav.innerHTML = '';
            const startDate = new Date(START_DATE);
            for(let i=1; i<=TOTAL_DAYS; i++) {
                const cur = new Date(startDate);
                cur.setDate(startDate.getDate() + (i-1));
                const mm = (cur.getMonth()+1).toString().padStart(2,'0');
                const dd = cur.getDate().toString().padStart(2,'0');
                const week = ['日','一','二','三','四','五','六'][cur.getDay()];
                const item = document.createElement('div');
                item.className = `date-item flex-none flex flex-col items-center justify-center w-16 h-20 border-2 rounded-3xl bg-white cursor-pointer transition-all ${i===currentDay ? 'active' : 'border-slate-50 text-slate-300'}`;
                item.innerHTML = `<span class="text-[10px] font-bold">${mm}/${dd}</span><span class="text-xl font-black">${dd}</span><span class="text-[10px] font-bold">周${week}</span>`;
                item.onclick = () => { currentDay = i; initDateNav(); loadData(); };
                nav.appendChild(item);
            }
        }

        async function loadData() {
            const { data } = await _supabase.from('trips').select('*').eq('day_num', currentDay).single();
            render(data);
        }

        function render(item) {
            const main = document.getElementById('main-content');
            if(!item) {
                main.innerHTML = `<div class="text-center py-20 bg-white rounded-[40px] shadow-sm border border-slate-50 animate-fadeIn"><p class="text-slate-400 font-bold mb-4">Day ${currentDay} 尚未規劃行程</p><button onclick="showModal()" class="bg-slate-900 text-white px-6 py-3 rounded-2xl text-xs font-black shadow-lg">開始規劃今日行程</button></div>`;
                return;
            }

            const transHtml = [...(item.transport_tags || []), item.transport_custom].filter(Boolean).map(t => `<span class="bg-slate-100 px-3 py-1 rounded-full text-[10px] font-bold text-slate-500">${t}</span>`).join('');
            const poisHtml = (item.poi_list || []).map((p, idx) => `
                <div class="flex items-center gap-4 p-4 bg-slate-50 rounded-2xl mb-3 border border-slate-100">
                    <span class="bg-slate-800 text-white w-7 h-7 rounded-full text-[10px] flex items-center justify-center font-black shrink-0">${idx+1}</span>
                    <div class="flex-1"><div class="text-[10px] text-orange-500 font-black">${p.time}</div><div class="font-black text-slate-700 text-sm">${p.name}</div></div>
                </div>
            `).join('');

            main.innerHTML = `
                <div class="bg-white rounded-[40px] p-8 shadow-xl border border-slate-50 animate-fadeIn relative">
                    <div class="flex justify-between items-start mb-6 border-b border-slate-50 pb-6">
                        <h2 class="text-3xl font-black text-slate-800">Day ${currentDay} <span class="text-[10px] bg-orange-100 text-orange-600 px-3 py-1.5 rounded-full align-middle ml-2 font-black">${item.stay_city || '福岡'}</span></h2>
                        <div class="flex gap-4"><button onclick="prepareEdit()" class="text-slate-300 hover:text-blue-500"><i class="fa-solid fa-pen-to-square text-xl"></i></button><button onclick="deleteDay()" class="text-slate-300 hover:text-red-500"><i class="fa-solid fa-trash-can text-xl"></i></button></div>
                    </div>

                    <div class="grid gap-4 mb-8 text-sm">
                        <div class="flex gap-4"><span class="text-slate-400 font-bold w-12 text-xs">目的地</span><span class="font-black text-slate-700">${item.destination || '---'}</span></div>
                        <div class="flex gap-4"><span class="text-slate-400 font-bold w-12 text-xs">住宿</span><span class="font-black text-slate-700">${item.accommodation || '---'}</span></div>
                        <div class="flex gap-4 items-center"><span class="text-slate-400 font-bold w-12 text-xs">交通</span><div class="flex flex-wrap gap-2">${transHtml || '<span class="text-slate-300">未設定</span>'}</div></div>
                    </div>

                    <div class="pt-8 border-t border-dashed border-slate-200">
                        <div class="flex justify-between items-center mb-6">
                            <h3 class="font-black text-slate-800 text-lg flex items-center gap-2">📍 行程地點</h3>
                            ${item.google_map_url ? `<a href="${item.google_map_url}" target="_blank" class="text-blue-600 text-[10px] font-black border-2 border-blue-50 px-4 py-2 rounded-full bg-blue-50">開啟路線 ↗</a>` : ''}
                        </div>
                        <div class="grid sm:grid-cols-2 gap-2">${poisHtml || '<p class="text-slate-300 italic text-sm">無地點資料</p>'}</div>
                    </div>
                </div>
            `;
        }

        async function prepareEdit() {
            const { data } = await _supabase.from('trips').select('*').eq('day_num', currentDay).single();
            if(data) {
                document.getElementById('in-city').value = data.stay_city || '';
                document.getElementById('in-dest').value = data.destination || '';
                document.getElementById('in-hotel').value = data.accommodation || '';
                document.getElementById('in-trans-custom').value = data.transport_custom || '';
                document.getElementById('in-map').value = data.google_map_url || '';
                selectedTrans = data.transport_tags || [];
                document.querySelectorAll('.trans-btn').forEach(btn => btn.classList.toggle('selected', selectedTrans.includes(btn.innerText)));
                document.getElementById('poi-container').innerHTML = '';
                (data.poi_list || []).forEach(p => addPoiRow(p.time, p.name));
                showModal();
            }
        }

        async function saveItem() {
            const poiRows = document.querySelectorAll('.poi-row');
            const poiList = Array.from(poiRows).map(row => ({
                time: row.querySelector('.poi-time').value,
                name: row.querySelector('.poi-name').value
            })).filter(p => p.name);

            const newItem = {
                day_num: currentDay,
                stay_city: document.getElementById('in-city').value,
                destination: document.getElementById('in-dest').value,
                accommodation: document.getElementById('in-hotel').value,
                transport_tags: selectedTrans,
                transport_custom: document.getElementById('in-trans-custom').value,
                google_map_url: document.getElementById('in-map').value,
                poi_list: poiList
            };

            const { error } = await _supabase.from('trips').upsert([newItem], { onConflict: 'day_num' });
            if(error) alert(error.message);
            else { hideModal(); loadData(); }
        }

        async function deleteDay() {
            if(!confirm("確定要刪除這天的所有行程嗎？")) return;
            await _supabase.from('trips').delete().eq('day_num', currentDay);
            loadData();
        }

        function showModal() { 
            document.getElementById('modal').classList.remove('hidden');
            if(document.getElementById('poi-container').children.length === 0) addPoiRow();
        }
        function hideModal() { 
            document.getElementById('modal').classList.add('hidden');
            // 清空交通選擇
            selectedTrans = [];
            document.querySelectorAll('.trans-btn').forEach(btn => btn.classList.remove('selected'));
            document.getElementById('poi-container').innerHTML = '';
        }

        window.onload = () => { initDateNav(); loadData(); };
    </script>
</body>
</html>
