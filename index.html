<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>個人筆記本</title>
    <script>
        const PASS = '1109'; // 你的密碼
        function auth() {
            const input = prompt('請輸入密碼：');
            if (input === PASS) {
                document.body.style.display = 'block';
            } else {
                alert('錯誤');
                location.reload();
            }
        }
    </script>
</head>
<body style="display:none;" onload="auth()">
    <h1>驗證成功！網頁正常運作中</h1>
    <p>如果你看到這個畫面，代表你的網頁已經成功上線了。</p>
</body>
</html>
