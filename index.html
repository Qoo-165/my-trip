<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>福岡吃貨團之旅 🍜</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .active-day { background: #fef3c7; border-color: #f59e0b; color: #b45309; }
        .transport-badge { @apply flex items-center gap-1 px-2 py-1 rounded-full border text-xs font-medium bg-white; }
        .poi-item { @apply flex items-center gap-3 p-3 bg-white border border-slate-100 rounded-xl mb-2; }
        .voucher-card { @apply p-3 bg-slate-50 border border-dashed border-slate-300 rounded-xl text-sm flex items-center gap-2; }
    </style>
</head>
<body class="bg-[#f8f9fa] min-h-screen pb-24">

    <header class="bg-white px-4 py-4 flex justify-between items-center sticky top-0 z-30 shadow-sm">
        <div class="flex items-center gap-2">
            <span class="text-xl">✈️</span>
            <h1 class="font-bold text-slate-700">福岡吃貨團之旅 🍜</h1>
        </div>
        <div class="flex items-center gap-2">
            <span class="text-[10px] text-green-500">● 已連線</span>
            <button onclick="showAddModal()" class="bg-slate-800 text-white text-xs px-3 py-2 rounded-lg font-bold">+ 新增行程</button>
        </div>
    </header>

    <div class="bg-white border-b overflow-x-auto flex px-4 py-3 gap-3 no-scrollbar sticky top-[60px] z-20" id="date-nav">
        </div>

    <main class="p-4 space-y-6" id="main-content">
        </main>

    <div class="fixed bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-white via-white to-transparent pointer-events-none">
        <div class="max-w-md mx-auto pointer-events-auto flex justify-around">
            </div>
    </div>

    <div id="modal" class="fixed inset-0 bg-black/50 hidden z-50 flex items-end sm:items-center justify-center">
        <div class="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl overflow-y-auto max-h-[85vh]">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold">編輯行程細節</h3>
                <button onclick="hideModal()" class="text-slate-400 p-2"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div class="space-y-4 text-sm">
                <div>
                    <label class="block font-bold text-slate-500 mb-1">目的地</label>
                    <input type="text" id="in-dest" placeholder="例如：博多運河城" class="w-full border p-3 rounded-xl outline-none focus:ring-2 ring-blue-500">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block font-bold text-slate-500 mb-1">地區標籤</label>
                        <input type="text" id="in-city" placeholder="福岡" class="w-full border p-3 rounded-xl outline-none">
                    </div>
                    <div>
                        <label class="block font-bold text-slate-500 mb-1">住宿飯店</label>
                        <input type="text" id="in-hotel" placeholder="飯店名稱" class="w-full border p-3 rounded-xl outline-none">
                    </div>
                </div>
                <div>
                    <label class="block font-bold text-slate-500 mb-1">交通工具 (用逗號隔開)</label>
                    <input type="text" id="in-trans" placeholder="地鐵, 步行, 巴士" class="w-full border p-3 rounded-xl outline-none">
                </div>
                <button onclick="saveItem()" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold text-lg mt-4">儲存並更新</button>
            </div>
        </div>
    </div>

    <script>
        // ======= ⚙️ 你的 Supabase 設定區 =======
        const SB_URL = 'https://mklbhyinzgruetajxkvq.supabase.co'; 
        const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1rbGJoeWluemdydWV0YWp4a3ZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ0NDMyNzksImV4cCI6MjA5MDAxOTI3OX0.XlQDwt4thOB7NH09f_fUkgHeMx-kR_Kw-SFQgPRR8V0'; // 請填入你的 Anon Key
        const TOTAL_DAYS = 5;
        // =====================================

        const _supabase = supabase.createClient(SB_URL, SB_KEY);
        let currentDay = 1;

        // 初始化日期導覽列
        function initDateNav() {
            const nav = document.getElementById('date-nav');
            for(let i=1; i<=TOTAL_DAYS; i++) {
                const item = document.createElement('div');
                item.id = `nav-day-${i}`;
                item.className = `flex-none flex flex-col items-center justify-center w-14 h-16 border rounded-xl bg-white cursor-pointer transition-all ${i===1 ? 'active-day shadow-sm' : 'text-slate-400 border-slate-100'}`;
                item.innerHTML = `<span class="text-[10px] font-bold">0${i}</span><span class="text-lg font-black">${i}</span>`;
                item.onclick = () => switchDay(i);
                nav.appendChild(item);
            }
        }

        async function switchDay(day) {
            currentDay = day;
            document.querySelectorAll('#date-nav > div').forEach(el => el.classList.remove('active-day', 'shadow-sm'));
            document.getElementById(`nav-day-${day}`).classList.add('active-day', 'shadow-sm');
            loadData();
        }

        async function loadData() {
            const { data } = await _supabase.from('trips').select('*').eq('day_num', currentDay).single();
            render(data);
        }

        function render(item) {
            const main = document.getElementById('main-content');
            if(!item) {
                main.innerHTML = `<div class="text-center py-20 text-slate-300">本日尚無詳細規劃，點擊上方按鈕開始。</div>`;
                return;
            }

            const transHtml = (item.transportation || "").split(',').map(t => `<div class="transport-badge"><i class="fa-solid fa-person-walking"></i> ${t.trim()}</div>`).join('');

            main.innerHTML = `
                <section class="animate-fadeIn">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-2xl font-black text-slate-800">第 ${item.day_num} 天 <span class="text-xs bg-orange-100 text-orange-600 px-2 py-1 rounded ml-2">${item.stay_city || '未定'}</span></h2>
                        <div class="flex gap-2">
                            <button onclick="showAddModal()" class="text-slate-400"><i class="fa-solid fa-pen"></i></button>
                        </div>
                    </div>

                    <div class="space-y-4">
                        <div class="grid grid-cols-4 gap-2 text-sm">
                            <div class="text-slate-400">目的地</div><div class="col-span-3 font-bold text-slate-700">${item.destination || '---'}</div>
                            <div class="text-slate-400">住宿</div><div class="col-span-3 font-bold text-slate-700">${item.accommodation || '---'}</div>
                            <div class="text-slate-400">交通</div><div class="col-span-3 flex flex-wrap gap-2">${transHtml}</div>
                        </div>

                        <div class="pt-6">
                            <div class="flex justify-between items-center mb-4">
                                <h3 class="font-bold text-slate-800 flex items-center gap-2"><i class="fa-solid fa-location-dot text-red-500"></i> 當日行程地點</h3>
                                <a href="#" class="text-blue-500 text-xs font-bold border border-blue-200 px-3 py-1 rounded-full bg-blue-50">Google Maps 路線 ↗</a>
                            </div>
                            <div class="poi-item"><span class="bg-slate-800 text-white w-6 h-6 rounded-full text-[10px] flex items-center justify-center font-bold">1</span> <div><div class="text-[10px] text-slate-400 font-bold">10:00</div><div class="font-bold text-slate-700">${item.destination}</div></div></div>
                        </div>

                        <div class="pt-6">
                            <h3 class="font-bold text-slate-800 mb-4">憑證</h3>
                            <div class="voucher-card"><i class="fa-solid fa-paperclip text-slate-400"></i> 飯店訂房確認單 (IT234...) <i class="fa-solid fa-chevron-right ml-auto text-slate-300"></i></div>
                        </div>
                    </div>
                </section>
            `;
        }

        async function saveItem() {
            const newItem = {
                day_num: currentDay,
                stay_city: document.getElementById('in-city').value,
                destination: document.getElementById('in-dest').value,
                accommodation: document.getElementById('in-hotel').value,
                transportation: document.getElementById('in-trans').value,
                sort_order: Date.now()
            };
            await _supabase.from('trips').upsert([newItem], { onConflict: 'day_num' });
            hideModal();
            loadData();
        }

        function showAddModal() { document.getElementById('modal').classList.remove('hidden'); }
        function hideModal() { document.getElementById('modal').classList.add('hidden'); }

        window.onload = () => { initDateNav(); loadData(); };
    </script>
</body>
</html>
